# /etc/nginx/sites-available/symbioll.com
# ln -s /etc/nginx/sites-available/symbioll.com /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name symbioll.com www.symbioll.com;

    root /var/www/symbioll.com/symbioll;
    index index.php index.html;

    access_log /var/log/nginx/symbioll.access.log;
    error_log /var/log/nginx/symbioll.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(config\.php|schema\.sql|config\.example\.php)$ {
        deny all;
    }

    location ~ ^/scripts/ {
        deny all;
    }
}
